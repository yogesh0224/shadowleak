name: solo-exploratory-v1

on:
  push:
    branches:
      - research/solo-evidence-run-20260919
    paths:
      - studies/run_solo_exploratory_v1.trigger

permissions:
  contents: read

concurrency:
  group: shadowleak-solo-exploratory-v1
  cancel-in-progress: false

jobs:
  single-model-pilot:
    name: new-synthetic-620-case-single-model-pilot
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HF_HOME: /tmp/shadowleak-solo-huggingface
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - name: Checkout immutable execution trigger commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pilot.txt
      - name: Install pinned model dependencies
        run: pip install -r requirements-pilot.txt
      - name: Validate new exploratory plan only
        run: python -m research.solo_plan --plan studies/solo_exploratory_v1.json --validate-only
      - name: Execute new solo exploratory model with fresh synthetic records
        run: >-
          python -m research.solo_execute
          --plan studies/solo_exploratory_v1.json
          --output-directory artifacts/solo_exploratory_v1
          --execution-commit "${GITHUB_SHA}"
      - name: Upload single-model new-data evidence and blank annotation queue
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shadowleak-solo-exploratory-v1-new-data
          path: artifacts/solo_exploratory_v1/
          if-no-files-found: warn
          retention-days: 30
