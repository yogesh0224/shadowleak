name: research-validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install research-test dependencies
        run: pip install -r requirements-research.txt
      - name: Run research validation tests
        run: python -m unittest discover -s tests -v
      - name: Compile application modules
        run: python -m compileall research ml_detector experiments model_interface
